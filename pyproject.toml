[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raya-opt"
version = "0.1.0"
description = "Cost-aware LLM gateway with built-in circuit breaker (loop, budget, depth)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{ name = "Raya-Opt" }]
keywords = ["llm", "gateway", "cost", "circuit-breaker", "fallback"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
include = ["raya_opt*"]
exclude = ["tests*", "examples*"]
